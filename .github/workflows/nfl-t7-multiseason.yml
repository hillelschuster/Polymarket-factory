name: NFL T-7 Multi-Season Replication
on:
  push:
    paths:
      - 'research/nfl_t7_multiseason.py'
      - '.github/workflows/nfl-t7-multiseason.yml'
  workflow_dispatch:

concurrency:
  group: polymarket-nfl-t7-multiseason
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run broad-tag multi-season replication
        run: python research/nfl_t7_multiseason.py
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: nfl-t7-multiseason-output
          path: nfl_t7_multiseason.json
