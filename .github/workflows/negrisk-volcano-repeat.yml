name: NegRisk Volcano Repeat Verify
on:
  push:
    paths:
      - 'research/negrisk_volcano_repeated_verify.py'
      - '.github/workflows/negrisk-volcano-repeat.yml'
  workflow_dispatch:

concurrency:
  group: polymarket-negrisk-volcano-repeat
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repeated six-leg verification
        run: python research/negrisk_volcano_repeated_verify.py
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: negrisk-volcano-repeat-output
          path: negrisk_volcano_repeated_verify.json
