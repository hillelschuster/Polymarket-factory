name: NegRisk Multi-Event Replication
on:
  push:
    paths:
      - 'research/negrisk_multi_event_replication.py'
      - '.github/workflows/negrisk-multi-event.yml'
  workflow_dispatch:

concurrency:
  group: polymarket-negrisk-multi-event
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Screen and reconstruct independent NegRisk events
        run: python research/negrisk_multi_event_replication.py
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: negrisk-multi-event-output
          path: negrisk_multi_event_replication.json
