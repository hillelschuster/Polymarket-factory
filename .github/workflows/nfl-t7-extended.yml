name: NFL T-7 Extended Replication
on:
  push:
    paths:
      - 'research/nfl_t7_extended_replication.py'
      - '.github/workflows/nfl-t7-extended.yml'
  workflow_dispatch:

concurrency:
  group: polymarket-nfl-t7-extended
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extend corrected NFL T-7 replication
        run: python research/nfl_t7_extended_replication.py
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: nfl-t7-extended-output
          path: nfl_t7_extended_replication.json
