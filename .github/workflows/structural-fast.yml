name: Structural Fast Check
on:
  push:
    paths:
      - '.github/workflows/structural-fast.yml'
  workflow_dispatch:

concurrency:
  group: polymarket-structural-fast
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build conservative logical inventory
        run: python research/logical_constraint_inventory.py
      - name: Probe current executable monotonicity pairs
        run: python research/logical_constraint_live_probe.py
      - name: Probe exact deadline ladders
        run: python research/date_ladder_live_probe.py
      - name: Upload fast structural outputs
        uses: actions/upload-artifact@v4
        with:
          name: structural-fast-output
          path: |
            logical_constraint_inventory.json
            logical_constraint_live_probe.json
            date_ladder_live_probe.json
