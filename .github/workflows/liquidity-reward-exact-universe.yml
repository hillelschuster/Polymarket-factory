name: Liquidity Reward Exact Universe
on:
  push:
    paths:
      - 'research/liquidity_reward_exact_universe.py'
      - '.github/workflows/liquidity-reward-exact-universe.yml'
  workflow_dispatch:

concurrency:
  group: polymarket-liquidity-reward-exact-universe
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Search exact reward universe
        run: python research/liquidity_reward_exact_universe.py
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: liquidity-reward-exact-universe-output
          path: liquidity_reward_exact_universe.json
