name: NegRisk Forward Paper Observer
on:
  push:
    paths:
      - 'research/negrisk_forward_paper_observer.py'
      - '.github/workflows/negrisk-forward-paper.yml'
  workflow_dispatch:

concurrency:
  group: polymarket-negrisk-forward-paper
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Observe short-dated complete baskets
        run: python research/negrisk_forward_paper_observer.py
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: negrisk-forward-paper-output
          path: negrisk_forward_paper_observer.json
