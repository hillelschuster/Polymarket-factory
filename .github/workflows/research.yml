name: Polymarket Factory Research
on:
  push:
    paths:
      - 'research/**'
      - '.github/workflows/research.yml'
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Executable midterm cross-venue probe
        run: python research/midterm_crossvenue_probe.py
      - name: FOMC cross-venue Warsh audit
        run: python research/fomc_crossvenue_warsh.py
      - name: Upload research outputs
        uses: actions/upload-artifact@v4
        with:
          name: research-output
          path: |
            midterm_crossvenue_probe.json
            fomc_crossvenue_warsh.json
