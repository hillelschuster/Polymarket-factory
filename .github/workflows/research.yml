name: Polymarket Factory Research
on:
  push:
    paths:
      - 'research/logical_constraint_inventory.py'
      - 'research/logical_constraint_live_probe.py'
      - 'research/negrisk_yes_basket_screen.py'
      - 'research/date_ladder_live_probe.py'
      - 'research/state_family_inventory.py'
      - '.github/workflows/research.yml'
  workflow_dispatch:

concurrency:
  group: polymarket-alpha-structural-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inventory repeated state-constraint market families
        run: python research/state_family_inventory.py
      - name: Inventory unenforced monotonic logical constraints
        run: python research/logical_constraint_inventory.py
      - name: Probe live executable monotonicity violations
        run: python research/logical_constraint_live_probe.py
      - name: Probe exact deadline ladders
        run: python research/date_ladder_live_probe.py
      - name: Screen unsupported NegRisk YES-basket underrounds
        run: python research/negrisk_yes_basket_screen.py
      - name: Upload research outputs
        uses: actions/upload-artifact@v4
        with:
          name: research-output
          path: |
            state_family_inventory.json
            logical_constraint_inventory.json
            logical_constraint_live_probe.json
            date_ladder_live_probe.json
            negrisk_yes_basket_screen.json
