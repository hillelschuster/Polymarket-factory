name: Polymarket Factory Research
on:
  push:
    paths:
      - 'research/**'
      - '.github/workflows/research.yml'
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe public sources
        run: python research/probe_sources.py
      - name: XTracker chronological backtest
        run: python research/xtracker_backtest.py
      - name: XTracker actual-print audit
        run: python research/xtracker_audit.py
      - name: Macro release latency test
        run: python research/macro_release_latency.py
      - name: Upload research outputs
        uses: actions/upload-artifact@v4
        with:
          name: research-output
          path: |
            probe_output.json
            xtracker_backtest.json
            xtracker_audit.json
            macro_release_latency.json
