name: Polymarket Factory Research
on:
  push:
    paths:
      - 'research/**'
      - '.github/workflows/research.yml'
  workflow_dispatch:

concurrency:
  group: polymarket-alpha-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inventory repeated state-constraint market families
        run: python research/state_family_inventory.py
      - name: Inventory unenforced monotonic logical constraints
        run: python research/logical_constraint_inventory.py
      - name: Upload research outputs
        uses: actions/upload-artifact@v4
        with:
          name: research-output
          path: |
            state_family_inventory.json
            logical_constraint_inventory.json
