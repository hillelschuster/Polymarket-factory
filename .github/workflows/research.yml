name: Polymarket Factory Research
on:
  push:
    paths:
      - 'research/**'
      - '.github/workflows/research.yml'
  workflow_dispatch:

concurrency:
  group: state-constraint-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover state-constrained Polymarket universe
        run: python research/state_market_discovery.py
      - name: Upload research outputs
        uses: actions/upload-artifact@v4
        with:
          name: research-output
          path: state_market_candidates.json
