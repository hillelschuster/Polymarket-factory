name: Liquidity Reward Live Screen
on:
  push:
    paths:
      - 'research/liquidity_reward_live_screen.py'
      - '.github/workflows/liquidity-rewards.yml'
  workflow_dispatch:

concurrency:
  group: polymarket-liquidity-rewards
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Screen current reward markets
        run: python research/liquidity_reward_live_screen.py
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: liquidity-reward-live-output
          path: liquidity_reward_live_screen.json
