name: NegRisk Converter Forward Observer
on:
  push:
    paths:
      - 'research/negrisk_converter_forward_observer.py'
      - '.github/workflows/negrisk-converter-forward.yml'
  workflow_dispatch:

concurrency:
  group: polymarket-negrisk-converter-forward
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Observe full-set converter arbitrage densely
        run: python research/negrisk_converter_forward_observer.py
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: negrisk-converter-forward-output
          path: negrisk_converter_forward_observer.json
