name: NegRisk Wallet Basket Audit
on:
  push:
    paths:
      - 'research/negrisk_2024_wallet_basket_audit.py'
      - '.github/workflows/negrisk-wallet-basket.yml'
  workflow_dispatch:

concurrency:
  group: polymarket-negrisk-wallet-basket
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct same-wallet complete baskets
        run: python research/negrisk_2024_wallet_basket_audit.py
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: negrisk-wallet-basket-output
          path: negrisk_2024_wallet_basket_audit.json
