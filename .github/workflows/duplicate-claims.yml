name: Duplicate Claim Live Check
on:
  push:
    paths:
      - 'research/duplicate_claim_live_probe.py'
      - '.github/workflows/duplicate-claims.yml'
  workflow_dispatch:

concurrency:
  group: polymarket-duplicate-claims
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan exact duplicate claims
        run: python research/duplicate_claim_live_probe.py
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: duplicate-claims-output
          path: duplicate_claim_live_probe.json
